<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Synergix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav">
    <div class="logo">Synergix</div>
    <nav><a>Products</a><a>Solutions</a><a>Pricing</a><a>Contact</a></nav>
  </header>

  <main>
    <h1 id="headline">Streamlining Tomorrow's Enterprise Solutions</h1>
    <p id="sub">Leverage scalable, best-in-class synergies to drive measurable outcomes.</p>
    <button id="cta">Request a Demo</button>

    <section class="features">
      <div class="card">Scalable</div>
      <div class="card">Secure</div>
      <div class="card">Seamless</div>
    </section>
  </main>

  <svg id="character" viewBox="0 0 440 400">
    <defs>
      <clipPath id="eyeClip"><path class="eye-shape"/></clipPath>
    </defs>
    <g id="char" opacity="0">
      <g id="eyeLeft">
        <path class="eye-shape" fill="#fff"/>
        <g clip-path="url(#eyeClip)"><circle class="iris" fill="#d62020"/></g>
        <path class="eye-shape" fill="none" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
        <path class="lashes" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g id="eyeRight" transform="translate(240,0)">
        <path class="eye-shape" fill="#fff"/>
        <g clip-path="url(#eyeClip)"><circle class="iris" fill="#d62020"/></g>
        <path class="eye-shape" fill="none" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
        <path class="lashes" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
      </g>
      <circle class="blush" cx="45" cy="235" r="20" fill="#c43df0"/>
      <circle class="blush" cx="395" cy="235" r="20" fill="#c43df0"/>
      <g id="mouthBar">
        <path d="M170,310 L270,310 M170,298 L170,322 M270,298 L270,322"
              fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
      </g>
      <ellipse id="mouthO" cx="220" cy="315" rx="34" ry="40" fill="#111"/>
    </g>
  </svg>

  <div id="caption"></div>

  <div id="hud">
    <div id="label">Loading...</div>
    <pre id="debug"></pre>
    <video id="video" autoplay playsinline muted></video>
  </div>

  <script type="module" src="js/vision.js"></script>
  <script type="module" src="js/scene.js"></script>
</body>
</html>
